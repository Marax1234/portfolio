packages:
  - "."

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Supply-Chain (B25 C-09): pnpm löst nur Versionen auf, die mindestens 7 Tage alt sind
# (in Minuten). Ergänzt den Dependabot-Cooldown, gilt auch für manuelle `pnpm add`.
minimumReleaseAge: 10080

