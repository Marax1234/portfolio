packages:
  - "."

# Supply-Chain (B25 C-09): pnpm löst nur Versionen auf, die mindestens 7 Tage alt sind
# (in Minuten). Ergänzt den Dependabot-Cooldown, gilt auch für manuelle `pnpm add`.
minimumReleaseAge: 10080

overrides:
  "undici@<7.29.1": "7.29.1"
  "nodemailer@<10.0.6": "10.0.10"
  "dompurify@<3.4.15": "3.4.15"
  "esbuild@<0.28.1": "0.28.1"
  "postcss@<8.5.28": "8.5.28"
  "js-yaml@<4.3.2": "4.3.2"
  "fast-uri@<3.1.8": "3.1.8"
  "immutable@<4.3.9": "4.3.9"
  "sharp@<0.35.4": "0.35.4"
  "brace-expansion@^1.0.0 <1.1.21": "1.1.21"
  "brace-expansion@^5.0.0 <5.0.12": "5.0.12"
  "browserslist@<4.29.0": "4.29.0"
  "nanoid@^3.0.0 <3.3.19": "3.3.19"
  "image-size@^2.0.0 <2.0.4": "2.0.4"
  "baseline-browser-mapping@<2.11.25": "2.11.25"

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
