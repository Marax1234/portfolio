  "baseline-browser-mapping@<2.11.25": "2.11.25"
  "brace-expansion@^1.0.0 <1.1.21": "1.1.21"
  "brace-expansion@^5.0.0 <5.0.12": "5.0.12"
  "browserslist@<4.29.0": "4.29.0"
  "dompurify@<3.4.15": "3.4.15"
  dompurify@<=3.4.15: '>=3.4.16'
  dompurify@<=3.4.16: '>=3.4.17'
