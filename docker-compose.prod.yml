# docker-compose.prod.yml
# App + PostgreSQL + Garage (Object Storage) + Umami — läuft auf hillerhome
# Ports gebunden an WireGuard-IP 10.10.0.2 (nur über Tunnel erreichbar)

services:

  app:
    # Build ohne DB und ohne Secrets (B25 D-02/D-03), nur die öffentlichen NEXT_PUBLIC_*-Werte.
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SERVER_URL: https://${DOMAIN}
        NEXT_PUBLIC_S3_PUBLIC_URL: https://cdn.${DOMAIN}
        NEXT_PUBLIC_UMAMI_SRC: https://umami.${DOMAIN}/script.js
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID}
    restart: unless-stopped
    # Obergrenze inkl. ffmpeg-Transkodierung; bei Überschreitung killt der
    # Kernel nur diesen Container, `restart` startet ihn neu.
    mem_limit: 2g
    memswap_limit: 2g
    # O-06: ffmpeg (nice 19) darf höchstens 3 der 4 Kerne belegen, einer bleibt für
    # Postgres, Garage, Umami und Vaultwarden.
    cpus: 3
    environment:
      NODE_ENV: production
      DATABASE_URI: postgres://portfolio:${POSTGRES_PASSWORD}@postgres:5432/portfolio
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_SERVER_URL: https://${DOMAIN}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: us-east-1
      S3_ENDPOINT: http://garage:3900
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: "true"
      NEXT_PUBLIC_S3_PUBLIC_URL: https://cdn.${DOMAIN}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      CONTACT_NOTIFY_TO: ${CONTACT_NOTIFY_TO}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      NEXT_PUBLIC_UMAMI_SRC: https://umami.${DOMAIN}/script.js
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID}
      UMAMI_API_URL: http://umami:3000
      UMAMI_ADMIN_USERNAME: ${UMAMI_ADMIN_USERNAME}
      UMAMI_ADMIN_PASSWORD: ${UMAMI_ADMIN_PASSWORD}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID}
    volumes:
      # E2/B23: nur der next/image-Cache überlebt ein Deploy; HTML/ISR startet mit
      # jedem neuen Container frisch (sonst alte Seiten nach dem Deploy).
      - next-image-cache:/app/.next/cache/images
    ports:
      - "10.10.0.2:3000:3000"   # nur über WireGuard-Tunnel
    # D-05: healthy erst, wenn Payload (inkl. prodMigrations) und Postgres bereit sind.
    # Damit wartet `up -d --wait` beim Deploy wirklich auf die App. wget = BusyBox (Alpine).
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "-T", "5", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 90s
      start_interval: 3s
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: portfolio
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro   # legt umami-DB mit an (siehe §5)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    # KEIN ports-Block — DB bleibt rein intern

  # Object Storage (ersetzt MinIO, B4). Key + Bucket legt Garage beim Start an,
  # Website-Zugriff/Alias/CORS einmalig per scripts/storage-init.sh (manual-deploy.md).
  garage:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY_ID}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      - "10.10.0.2:3902:3902"   # Web-Endpoint (read-only) — vom VPS-Caddy als cdn.* gefronted
      - "127.0.0.1:3900:3900"   # S3-API nur lokal (storage-init, Backup-Export); App nutzt garage:3900
    healthcheck:
      test: ["CMD", "/garage", "health"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - internal

  umami:
    # Gepinnt (B8): postgresql-latest ist seit Umami v3 deprecated und bekommt keine
    # Updates mehr. Updates kommen als Dependabot-PR (docker-compose).
    image: ghcr.io/umami-software/umami:3.4.0@sha256:85909afc45bdcda1917394594a087421fdbb05610fded0fa9f6fb861abb2f367
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 768m
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@postgres:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET}
    ports:
      - "10.10.0.2:3001:3000"   # Umami lauscht im Container auf 3000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

volumes:
  next-image-cache:
  pgdata:
  garage-meta:
  garage-data:

networks:
  internal:
    driver: bridge
