# Dependabot — §3.4 (Actions-Updates) und Unterstützung für §5.2 (SCA)
#
# §3.4 — Dependabot-Alerts/Updates für GitHub Actions sind aktiv; Updates kommen
#         als PR und durchlaufen vor dem Merge dieselben Security-Gates + Review.
# §5.2  — npm/pnpm-Ökosystem wird auf verwundbare Dependencies überwacht.
#
# Hinweis: Dependabot hält die in den Workflows gepinnten Commit-SHAs (§3.1)
# aktuell, indem es PRs mit dem jeweils neuen SHA + Versionskommentar öffnet.

version: 2
updates:
  # GitHub Actions auf Commit-SHA gepinnt halten (§3.1/§3.2/§3.4)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "security"
      - "dependencies"
    commit-message:
      prefix: "ci"
    # Nur Releases, die mindestens 7 Tage alt sind (Supply-Chain-Schutz, B8/B16).
    cooldown:
      default-days: 7

  # Anwendungs-Dependencies (pnpm) — Supply-Chain-Überwachung (§5.2)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "security"
      - "dependencies"
    commit-message:
      prefix: "deps"
    # Nur Releases, die mindestens 7 Tage alt sind (Supply-Chain-Schutz, B8/B16).
    cooldown:
      default-days: 7
    groups:
      # Patch-/Minor-Updates bündeln, um PR-Rauschen zu reduzieren.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Container-Images in docker-compose.{prod,dev}.yml (Tag + Digest gepinnt, B8).
  # Prod-Updates rollt Max manuell aus (manual-deploy.md), vorher Backup.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "docker"
    cooldown:
      default-days: 7
    ignore:
      # Postgres-Major-Upgrade braucht Dump/Restore, bewusst manuell.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
