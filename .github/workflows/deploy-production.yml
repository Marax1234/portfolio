# Production-Deploy — Portfolio Kilian Siebert (§8)
#
# STILLGELEGT seit 2026-09-29 (B24, Review D-01): kein automatischer Trigger mehr.
# Bis dahin startete der Workflow nach jedem grünen "CI Security Gates"-Lauf auf
# `main` und wartete auf eine Freigabe, obwohl kein Runner existiert.
#
# - Es gibt keinen Self-hosted Runner und wird keinen geben (Entscheidung A1:
#   öffentliches Repo, kein dauerhafter Runner mit Docker-Rechten auf dem Prod-Host).
# - Deploys laufen manuell nach manual-deploy.md.
# - Dieser Workflow wird durch den Zielablauf ersetzt, nicht repariert: Image in CI
#   → GHCR → Freigabe im Environment `production` → Deploy per Tailscale-SSH
#   (Portfolio-Review, Sessions 13–15).
# - Die Schritte unten entsprechen NICHT dem gelebten Ablauf (rsync statt git pull,
#   kein Dump, kein Rollback-Tag). Nicht manuell starten.
#
# Beibehaltene Schutzmechanismen, falls doch jemand startet:
#   §8.1  Environment `production` mit Required Reviewer + Branch-Policy `main`.
#   §3.1  Externe Action auf Commit-SHA gepinnt.
#   §3.5  Keine direkte Interpolation von github.event.*-Werten in run-Steps.

name: Deploy Production

on:
  workflow_dispatch:

# §1.1.2 — Read-Only als Default.
permissions: read-all

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy to Production (hillerhome)
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 30
    # §8.1 — Erzwingt Required-Reviewer-Approval (Environment-Schutzregel).
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sync nach /opt/portfolio
        run: |
          rsync -a --delete \
            --exclude='.git' --exclude='.env.prod' --exclude='init-db' \
            ./ /opt/portfolio/

      - name: Datenbank & Object-Storage hochfahren
        working-directory: /opt/portfolio
        run: |
          docker compose --env-file .env.prod -f docker-compose.prod.yml up -d postgres garage

      - name: Build-Env generieren (Container-IPs)
        working-directory: /opt/portfolio
        run: ./scripts/gen-build-env.sh

      # §8.3 (Should) — Vor dem Deploy ausstehende Migrationen sichtbar machen.
      # Schlägt nicht hart fehl, falls die DB vom Host nicht erreichbar ist; der
      # verbindliche Lauf passiert in der builder-Stage (§6.3).
      - name: Migration-Status (Dry-Run)
        working-directory: /opt/portfolio
        continue-on-error: true
        run: |
          set -a && . ./.env.prod && set +a
          pnpm install --frozen-lockfile
          pnpm migrate:status

      # §6.3 — `docker compose build app` führt in der builder-Stage `payload
      # migrate` aus (Dockerfile Zeile 32). Migrationen werden also vor dem
      # Start angewandt; der Build-Log listet die angewandten Migrationen.
      - name: Build app (inkl. payload migrate)
        working-directory: /opt/portfolio
        run: |
          docker compose --env-file .env.prod -f docker-compose.prod.yml build app

      - name: App neu starten
        working-directory: /opt/portfolio
        run: |
          docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --no-deps app
