# CI Security Gates — Portfolio Kilian Siebert
#
# Implementiert die 🔴-Must-Punkte der Security-Checkliste, die als Code im Repo
# leben (Abschnitte 1.1, 3, 4, 5). Diese Gates laufen bei jedem Pull Request gegen
# `main` und bei jedem Push auf `main`. Sie müssen in den Branch-Protection-Regeln
# als "Required Status Checks" eingetragen werden (siehe docs/security/github-settings.md),
# damit kein Merge ohne grüne Gates möglich ist (§1.2.4, §5.1.3, §5.2.2, §5.3.4, §5.4.1).
#
# Härtung:
#   §1.1.2  permissions: read-all auf Workflow-Ebene; Jobs erhalten Writes nur explizit.
#   §1.1.3  Kein Job hat write-all; jedes permissions-Feld ist begründet.
#   §1.1.4  Kein pull_request_target -> Fork-PRs laufen ohne Produktions-Secrets.
#   §3.1    Alle externen Actions sind auf einen 40-Zeichen-Commit-SHA gepinnt.
#   §3.5    Kein github.event.*-Wert wird direkt in einen run-Step interpoliert.
#   §4.1    Gates laufen auf GitHub-Hosted Runnern ohne Deployment-Secrets.

name: CI Security Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# §1.1.2 — Standard ist Read-Only. Jeder Job erweitert nur, was er wirklich braucht.
permissions: read-all

# Doppelte Läufe auf demselben Branch/PR abbrechen.
concurrency:
  group: ci-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── §5.1 Secret Scan Gate ────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # gitleaks-action listet PR-Commits zum Diff-Scan (§5.1.1)
    steps:
      - name: Checkout (vollständige History für Diff-Scan, §5.1.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # §5.1.2/§5.1.3 — Gitleaks deckt API-Keys, Tokens, Passwörter, Connection
      # Strings ab und bricht bei einem Fund mit Exit-Code != 0 ab (Merge-Blocker).
      # False Positives werden in .gitleaks.toml gepflegt (§5.1.4), nicht durch
      # Deaktivieren des Checks.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

  # ── §5.2 SCA Gate (Software Composition Analysis) ────────────────────────
  sca:
    name: SCA (pnpm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      # Kein `cache: pnpm` hier: Dieser Job führt nie `pnpm install` aus
      # (nur `pnpm audit`, das ohne node_modules/Store arbeitet), daher würde
      # der Cache-Save-Step nie einen Store-Pfad zum Sichern finden
      # ("Path Validation Error: Path(s) specified ... do(es) not exist").
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # §5.2.2 — Critical/High-CVEs in Produktions-Dependencies blockieren den Merge.
      # --prod schließt devDependencies aus (die werden separat bewertet, §5.2.4).
      # `--audit-level` wird NICHT als alleiniges Gate genutzt: pnpm gibt bei jedem
      # gefundenen Advisory Exit-Code 1 zurück, unabhängig vom Level. Stattdessen
      # werten wir das JSON aus und gaten explizit nur auf high/critical.
      - name: pnpm audit (prod, high+critical)
        run: |
          set -euo pipefail
          pnpm audit --prod --json > audit.json || true
          HIGH=$(jq '(.metadata.vulnerabilities.high // 0) + (.metadata.vulnerabilities.critical // 0)' audit.json)
          echo "High/Critical-Vulnerabilities: $HIGH"
          if [ "$HIGH" -gt 0 ]; then
            jq -r '.advisories[]? | select(.severity == "high" or .severity == "critical") | "\(.severity): \(.module_name) — \(.title)"' audit.json
            echo "::error::SCA-Gate fehlgeschlagen — $HIGH High/Critical-Finding(s)."
            exit 1
          fi
          echo "SCA-Gate bestanden (0 High/Critical)."

  # ── §5.3 SAST Gate (Static Application Security Testing) ─────────────────
  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write # §5.3.3 — SARIF-Upload in den Security-Tab (Repo ist public -> Code Scanning kostenlos)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # §5.3.2 — JavaScript/TypeScript inkl. Next.js-/React-/Node.js-Patterns.
      # security-extended erweitert den Standard-Regelsatz um zusätzliche
      # Security-Queries.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          queries: security-extended

      # §5.3.3 — upload: always lädt das SARIF in Security → Code Scanning hoch
      # (für öffentliche Repos kostenlos). Trends sind dort zentral sichtbar.
      - name: Analyze
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          category: "/language:javascript-typescript"
          output: sarif-results
          upload: always

      # §5.3.4 — High-/Critical-Findings blockieren den Merge. CodeQL/analyze
      # lädt nur hoch, bricht aber nicht ab; deshalb werten wir das SARIF
      # (security-severity >= 7.0 = High/Critical) explizit aus und lassen den
      # Job fehlschlagen.
      - name: Enforce SAST severity gate
        run: |
          set -euo pipefail
          SARIF=$(find sarif-results -name '*.sarif' | head -1)
          if [ -z "$SARIF" ]; then
            echo "::error::Kein SARIF-Report gefunden — SAST-Gate kann nicht bewertet werden."
            exit 1
          fi
          # CodeQL legt die security-severity der Regeln in tool.extensions[].rules
          # ab (Query-Packs), nicht nur in tool.driver.rules — beide Quellen werden
          # zusammengeführt, sonst findet das Gate die Werte nie (security-severity
          # >= 7.0 = High/Critical).
          COUNT=$(jq '
            [ .runs[]
              | ((.tool.driver.rules // []) + ([.tool.extensions[]?.rules[]?])) as $rules
              | .results[]?
              | .ruleId as $rid
              | ([ $rules[] | select(.id == $rid) | (.properties."security-severity" // empty) ] | first)
              | select(. != null)
              | tonumber
              | select(. >= 7.0)
            ] | length' "$SARIF")
          echo "High/Critical SAST-Findings: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "::error::SAST-Gate fehlgeschlagen — $COUNT High/Critical-Finding(s). Details im Security → Code-Scanning-Tab."
            exit 1
          fi
          echo "SAST-Gate bestanden."

  # ── §5.4 TypeScript Strict Check Gate ────────────────────────────────────
  typecheck:
    name: TypeScript Strict Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # §5.4.1 — tsc --noEmit; strict ist in tsconfig.json aktiviert, daher ist
      # dies effektiv `tsc --noEmit --strict`. Type-Fehler blockieren den Merge.
      - name: TypeScript check
        run: pnpm typecheck

  # ── Lint Gate (B25 C-01) ─────────────────────────────────────────────────
  # eslint src/ (Next core-web-vitals + TypeScript). Fehler blockieren den Merge,
  # Warnungen nicht. Als Required Check "Lint" eintragen (github-settings.md).
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

  # ── Test Gate (B25 S-07) ─────────────────────────────────────────────────
  # Vitest-Unit-Tests für src/lib (ohne DB, ohne Payload-Boot, ohne Netz).
  # Als Required Check "Test" eintragen (github-settings.md).
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Vitest
        run: pnpm test

  # ── Build + Image (B25 C-01/C-02/C-03, D-02/D-03, A2) ────────────────────
  # Baut das Produktions-Image ohne DB und ohne Secrets. Die Build-Args sind dieselben
  # öffentlichen NEXT_PUBLIC_*-Werte wie in docker-compose.prod.yml (die Umami-Website-ID
  # steht in jeder ausgelieferten Seite). Trivy: HIGH/CRITICAL mit verfügbarem Fix blockiert,
  # Ausnahmen nur begründet in .trivyignore.
  #   PR:           Image als Artefakt für den DAST-Job, kein Push.
  #   Push auf main: ghcr.io/marax1234/portfolio-app:<sha> (öffentlich, A2), dazu CycloneDX-SBOM
  #                 und SLSA-Provenance als signierte Attestationen am Digest (Sigstore).
  #                 deploy.yml prüft die Provenance vor dem Deploy.
  # Als Required Check "Build" eintragen (github-settings.md).
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write # nur bei Push auf main genutzt: GHCR-Push + Attestation in der Registry
      id-token: write # Sigstore-Signaturzertifikat für die Attestationen (nur main)
      attestations: write # Attestationen speichern (nur main)
      artifact-metadata: write # Storage-Record zur Attestation (nur main)
    env:
      IMAGE: ghcr.io/marax1234/portfolio-app
      # Trivy direkt als Release-Binary (sha256 gepinnt) statt trivy-action/setup-trivy:
      # deren Tags waren im März 2026 kompromittiert (GHSA-69fq-xp46-6x23).
      TRIVY_VERSION: 0.74.0
      TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Cache nur für Image-Schichten (keine Secrets im Build, D-03). PR-Läufe lesen den
      # main-Cache, schreiben aber nur in ihren eigenen Scope.
      - name: Image bauen (ohne DB/Secrets)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          provenance: false
          sbom: false
          tags: portfolio-app:ci
          labels: |
            org.opencontainers.image.source=https://github.com/Marax1234/portfolio
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SERVER_URL=https://kilia-siebert.de
            NEXT_PUBLIC_S3_PUBLIC_URL=https://cdn.kilia-siebert.de
            NEXT_PUBLIC_UMAMI_SRC=https://umami.kilia-siebert.de/script.js
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=edfe3c11-7959-4750-85de-134e840880c2
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max

      - name: Trivy installieren (Release-Binary, sha256 geprüft)
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/trivy.tgz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tgz" -C "$RUNNER_TEMP" trivy
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Trivy-Gate (HIGH/CRITICAL mit verfügbarem Fix)
        run: |
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile .trivyignore --exit-code 1 --no-progress portfolio-app:ci

      - name: Image für DAST weitergeben (nur PR)
        if: github.event_name == 'pull_request'
        run: docker save portfolio-app:ci | zstd -T0 -3 -q -o "$RUNNER_TEMP/portfolio-app.tar.zst"

      - name: Image-Artefakt hochladen (nur PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portfolio-app-image
          path: ${{ runner.temp }}/portfolio-app.tar.zst
          retention-days: 1
          compression-level: 0

      - name: Login GHCR (nur main)
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Gleiche Eingaben wie oben → alle Schichten aus dem Cache, nur der Push kommt dazu.
      - name: Image nach GHCR pushen (nur main)
        id: push
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Marax1234/portfolio
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SERVER_URL=https://kilia-siebert.de
            NEXT_PUBLIC_S3_PUBLIC_URL=https://cdn.kilia-siebert.de
            NEXT_PUBLIC_UMAMI_SRC=https://umami.kilia-siebert.de/script.js
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=edfe3c11-7959-4750-85de-134e840880c2
          cache-from: type=gha,scope=image

      - name: SBOM erzeugen (CycloneDX, nur main)
        if: github.event_name == 'push'
        run: trivy image --format cyclonedx --output sbom.cdx.json --no-progress portfolio-app:ci

      - name: Provenance-Attestation (SLSA, nur main)
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: SBOM-Attestation (nur main)
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

      - name: SBOM archivieren (nur main)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90

      - name: Digest in die Zusammenfassung
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "Image: \`${IMAGE}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"

  # ── Workflow-Linter (B25 C-08, vorerst nur Hinweise) ─────────────────────
  # zizmor prüft die Workflows auf typische Actions-Schwachstellen (Credential-
  # Persistenz, Injection, zu breite Rechte). Findings erscheinen als Annotationen
  # und blockieren nicht; kein Required Check. Version fest gepinnt (PyPI, ≥ 7 Tage).
  zizmor:
    name: Workflow-Lint (zizmor, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pipx run --spec zizmor==1.30.1 zizmor --format=github .github/workflows \
            || echo "::warning::zizmor meldet Findings (advisory, siehe Annotationen)."

  # ── §6/§7 DAST gegen das gebaute Image (B25 C-04, A6) ─────────────────────
  # Kein dauerhaftes Staging: ephemerer Stack im Runner. Gescannt wird genau das Image aus
  # dem Build-Job – im PR das Artefakt, auf main der GHCR-Digest (= was deploy.yml ausrollt).
  # Postgres + Garage aus docker-compose.dev.yml, nur Dummy-Secrets (§4.1), Migrationen beim
  # App-Start (prodMigrations, §6.2/§6.3), Seed mit Nicht-Echtdaten (§6.1), dann OWASP ZAP
  # Baseline (§7.2), Ausnahmen in .zap/rules.tsv (§7.4). Rot im PR = vor dem Merge sichtbar;
  # rot auf main = kein Deploy (deploy.yml braucht einen grünen Lauf) + Issue (Job dast-issue).
  dast:
    name: DAST (ZAP baseline, Image)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read # Pull des GHCR-Digests auf main
    env:
      IMAGE: ghcr.io/marax1234/portfolio-app
      # §4.1 — ausschließlich Dummy-Werte, KEINE Produktions-Secrets.
      PAYLOAD_SECRET: ci-dast-ephemeral-secret-not-a-real-key-000000
      DATABASE_URI: postgres://portfolio:portfolio@localhost:5432/portfolio
      S3_BUCKET: portfolio-media
      S3_REGION: us-east-1
      S3_ENDPOINT: http://localhost:9100
      S3_ACCESS_KEY_ID: GKdevlocal0000000000000000
      S3_SECRET_ACCESS_KEY: dev-local-only-not-a-secret
      S3_FORCE_PATH_STYLE: "true"
      # Nur für den Seed (läuft aus dem Checkout). Die App im Image hat die Prod-Werte
      # eingebacken (NEXT_PUBLIC_* sind Build-Zeit-Werte).
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      NEXT_PUBLIC_S3_PUBLIC_URL: http://localhost:9102
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image-Artefakt holen (PR)
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portfolio-app-image
          path: ${{ runner.temp }}

      - name: Image laden (PR)
        if: github.event_name == 'pull_request'
        run: |
          zstd -d -q -c "$RUNNER_TEMP/portfolio-app.tar.zst" | docker load
          docker tag portfolio-app:ci portfolio-app:dast

      - name: Login GHCR (main)
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image per Digest holen (main)
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          docker pull "${IMAGE}@${DIGEST}"
          docker tag "${IMAGE}@${DIGEST}" portfolio-app:dast

      - name: Infrastruktur hochfahren (Postgres + Garage)
        run: docker compose -f docker-compose.dev.yml up -d --wait

      # Website-Zugriff, Host-Alias, CORS und Platzhalter im Bucket (idempotent).
      - name: Object Storage einrichten
        run: scripts/storage-init.sh

      # Env-Werte per Name durchreichen (nicht als Argument). Host-Netz, damit die App
      # Postgres/Garage unter localhost erreicht; prodMigrations laufen beim Start.
      - name: App aus dem Image starten und auf /api/health warten
        run: |
          docker run -d --name app --network host \
            -e DATABASE_URI -e PAYLOAD_SECRET -e S3_BUCKET -e S3_REGION -e S3_ENDPOINT \
            -e S3_ACCESS_KEY_ID -e S3_SECRET_ACCESS_KEY -e S3_FORCE_PATH_STYLE \
            portfolio-app:dast
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health >/dev/null 2>&1; then
              echo "App bereit."; exit 0
            fi
            sleep 3
          done
          echo "::error::App wurde nicht bereit."; docker logs --tail 80 app; exit 1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies (für den Seed)
        run: pnpm install --frozen-lockfile

      # §6.1 — Repräsentative, NICHT echte Daten. Schlägt das Seeding fehl, scannen wir
      # trotzdem die laufende App (leere DB).
      - name: Seed-Daten
        continue-on-error: true
        run: pnpm seed

      # Ziel über die docker0-Bridge-IP, damit der ZAP-Container die App im Host-Netz erreicht.
      - name: ZAP-Ziel ermitteln
        run: |
          HOST_IP=$(ip -4 -o addr show docker0 | awk '{print $4}' | cut -d/ -f1)
          echo "ZAP_TARGET=http://${HOST_IP}:3000" >> "$GITHUB_ENV"

      # §7.2/§7.3 — fail_action: true -> Findings blockieren (PR: Merge-Hinweis, main: Deploy).
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ env.ZAP_TARGET }}
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-baseline-report

      - name: App-Log bei Fehlschlag
        if: failure()
        run: docker logs --tail 150 app || true

      - name: Stack herunterfahren
        if: always()
        run: |
          docker rm -f app || true
          docker compose -f docker-compose.dev.yml down -v

  # ── A6: roter DAST auf main → GitHub-Issue (kein ntfy aus GitHub) ─────────
  # Eigener Job, damit nur er Issues schreiben darf. Ein offenes Issue bekommt bei weiteren
  # Fehlschlägen einen Kommentar statt eines Duplikats.
  dast-issue:
    name: DAST-Fehlschlag melden (main)
    needs: dast
    if: always() && github.event_name == 'push' && needs.dast.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Issue anlegen oder kommentieren
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = '[dast] ZAP-Baseline auf main fehlgeschlagen';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Der DAST-Job (ZAP-Baseline gegen das GHCR-Image) ist auf \`main\` rot: ${runUrl}`,
              `Commit: ${context.sha}`,
              '',
              'Folge: deploy.yml startet für diesen Commit nicht. Report: Artefakt `zap-baseline-report`.',
              'Echte Findings beheben, False Positives begründet in `.zap/rules.tsv` eintragen (§7.4).',
              '',
              '_Automatisch erzeugt (B25 A6)._',
            ].join('\n');
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'security', per_page: 100,
            });
            const existing = open.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body,
              });
              core.info(`Kommentar an #${existing.number}`);
            } else {
              const { data } = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['security'],
              });
              core.info(`Issue #${data.number} angelegt`);
            }
